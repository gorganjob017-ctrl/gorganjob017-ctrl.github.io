<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل گرگان جاب</title>
<style>
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#faf7ee;margin:0;padding:16px;max-width:560px;margin-inline:auto;color:#1b1b1b}
h1{background:#FFC400;padding:12px 16px;border-radius:12px;font-size:22px}
input,select,textarea{width:100%;margin:6px 0;padding:10px;border:2px solid #1b1b1b;border-radius:10px;font:inherit;background:#fff;box-sizing:border-box}
button{padding:10px 18px;border:0;border-radius:10px;background:#1b1b1b;color:#FFC400;font:inherit;font-weight:700}
.r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e6e0cf}
#msg{margin:10px 0;font-weight:700}
</style></head><body><h1>پنل مدیریت گرگان جاب</h1><div id="msg"></div>
<div id="login"><input id="em" type="email" placeholder="ایمیل"><input id="pw" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button></div>
<div id="panel" hidden>
<input id="t" placeholder="عنوان آگهی (مثلا: کافه‌دار با سابقه)"><input id="co" placeholder="نام کارفرما یا مجموعه"><input id="ci" placeholder="شهر (پیش‌فرض: گرگان)">
<select id="cat"><option>اداری</option><option>فروشگاهی</option><option>خدماتی</option><option>فنی</option><option>آموزشی</option></select>
<textarea id="d" rows="5" placeholder="شرح شغل، شرایط و ساعت کار"></textarea>
<input id="c" placeholder="شماره تماس یا آیدی اینستاگرام">
<label><input id="n" type="checkbox" checked style="width:auto"> ارسال نوتیف به کاربران</label><br><br>
<button onclick="pub()">انتشار آگهی</button><h3>آگهی‌های اخیر</h3><div id="ads"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $=i=>document.getElementById(i),v=i=>$(i).value.trim(),msg=t=>$("msg").textContent=t;
firebase.initializeApp(CFG.firebase);const db=firebase.firestore();
firebase.auth().onAuthStateChanged(u=>{$("login").hidden=!!u;$("panel").hidden=!u;if(u)load()});
const login=()=>firebase.auth().signInWithEmailAndPassword(v("em"),v("pw")).catch(()=>msg("ایمیل یا رمز اشتباه است"));
function load(){db.collection("ads").orderBy("at","desc").limit(30).onSnapshot(s=>{
  $("ads").innerHTML=s.docs.map(d=>`<div class="r"><span>${d.data().title.replace(/</g,"&lt;")}</span><button onclick="del('${d.id}')">حذف</button></div>`).join("")})}
const del=id=>confirm("این آگهی حذف شود؟")&&db.collection("ads").doc(id).delete();
async function pub(){
  if(!v("t")||!v("c"))return msg("عنوان و راه تماس را وارد کن");
  await db.collection("ads").add({title:v("t"),company:v("co"),city:v("ci")||"گرگان",cat:$("cat").value,desc:v("d"),contact:v("c"),at:firebase.firestore.FieldValue.serverTimestamp()});
  const title=v("t");["t","co","ci","d","c"].forEach(i=>$(i).value="");
  if(!$("n").checked)return msg("آگهی منتشر شد");
  const k=localStorage.k||(localStorage.k=prompt("کلید REST اپ در OneSignal"));
  try{const r=await fetch("https://api.onesignal.com/notifications",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Key "+k},
    body:JSON.stringify({app_id:CFG.onesignalAppId,included_segments:["Subscribed Users"],headings:{en:"آگهی جدید در گرگان جاب"},contents:{en:title}})});
    if(!r.ok)throw 0;msg("آگهی منتشر و نوتیف ارسال شد")}
  catch{msg("آگهی منتشر شد، ولی نوتیف خودکار نرفت. از داشبورد OneSignal (Messages ← New Push) دستی بفرست.")}
}
</script></body></html>
