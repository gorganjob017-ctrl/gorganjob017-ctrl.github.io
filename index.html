<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>گرگان جاب</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FFC400"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC400;--k:#1b1b1b;--p:#faf7ee;--g:#6b675c;--l:#e6e0cf}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--p);color:var(--k);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--y);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
h1{font-size:26px;font-weight:900}header p{font-size:13px;margin-top:2px}
input{width:100%;margin-top:10px;padding:10px 12px;border:2px solid var(--k);border-radius:10px;font:inherit;background:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.tabs button{flex:none;padding:6px 14px;border:2px solid var(--k);border-radius:99px;background:none;font:inherit;font-size:14px}
.tabs .on{background:var(--k);color:var(--y)}
.ad{margin:0 16px;padding:14px 12px;border-bottom:1px solid var(--l);border-right:5px solid transparent}
.ad.new{border-right-color:var(--y)}
.ad h2{font-size:17px;font-weight:700}.m{color:var(--g);font-size:13px;margin-top:3px}
.ad .d{display:none;margin-top:10px;font-size:15px;line-height:1.9;white-space:pre-line}
.ad.open .d{display:block}
.ad a{display:inline-block;margin-top:10px;padding:9px 18px;background:var(--k);color:var(--y);border-radius:10px;text-decoration:none;font-weight:700}
p.e{text-align:center;color:var(--g);padding:40px 16px}
</style></head><body>
<header><h1>گرگان جاب</h1><p>پلی میان کارجویان و کارفرمایان</p><button id="bell" style="margin-top:8px;padding:6px 14px;border:2px solid #1b1b1b;border-radius:99px;background:#fff;font:inherit;font-size:13px">🔔 فعال‌سازی اعلان آگهی جدید</button>
<input id="q" placeholder="جستجوی آگهی، شغل یا شرکت"></header>
<div class="tabs" id="tabs"></div><main id="list"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const C=window.CFG,$=i=>document.getElementById(i);
const cats=["همه","اداری","فروشگاهی","خدماتی","فنی","آموزشی"];let cat="همه",ads=[];
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function days(a){const t=a.at&&a.at.toDate?a.at.toDate():new Date();return Math.floor((Date.now()-t)/864e5)}
function when(n){return n<1?"امروز":n==1?"دیروز":n+" روز پیش"}
function link(c){c=c.trim();return /^[0-9+]/.test(c)?"tel:"+c:"https://instagram.com/"+c.replace("@","")}
function render(){
  $("tabs").innerHTML=cats.map(c=>`<button class="${c==cat?"on":""}" data-c="${c}">${c}</button>`).join("");
  const q=$("q").value.trim();
  const r=ads.filter(a=>(cat=="همه"||a.cat==cat)&&(!q||(a.title+a.company+a.desc).includes(q)));
  $("list").innerHTML=r.length?r.map(a=>`<div class="ad ${days(a)<1?"new":""}"><h2>${esc(a.title)}</h2>
  <div class="m">${esc(a.company)} · ${esc(a.city)} · ${when(days(a))}</div>
  <div class="d">${esc(a.desc)}<br><a href="${esc(link(a.contact))}">تماس با کارفرما</a></div></div>`).join(""):'<p class="e">آگهی‌ای پیدا نشد. دسته یا کلمه‌ی دیگری را امتحان کن.</p>';
}
$("tabs").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};
$("q").oninput=render;
$("list").onclick=e=>{const a=e.target.closest(".ad");if(a&&e.target.tagName!="A")a.classList.toggle("open")};
firebase.initializeApp(C.firebase);
firebase.firestore().collection("ads").orderBy("at","desc").limit(100).onSnapshot(
  s=>{ads=s.docs.map(d=>d.data());render()},
  ()=>{$("list").innerHTML='<p class="e">اتصال برقرار نشد. اینترنت را بررسی کن.</p>'});
render();
window.OneSignalDeferred=window.OneSignalDeferred||[];if(C.onesignalAppId)OneSignalDeferred.push(async O=>{await O.init({appId:C.onesignalAppId});$("bell").onclick=()=>O.Notifications.requestPermission()});else $("bell").hidden=true;
</script><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script></body></html>
